name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.cc }} · readline=${{ matrix.readline }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        readline: [1, 0]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev clang

      - name: Build
        run: make CC=${{ matrix.cc }} READLINE=${{ matrix.readline }}

      - name: Version
        run: ./trsh --surum

      - name: Test
        run: make test

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      # Recent runner kernels use more mmap randomness than ASan supports.
      - name: Allow AddressSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build with sanitizers
        run: make debug

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash tests/run.sh

  install:
    name: make install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Install to a temporary prefix
        run: |
          make install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/trsh" -c 'echo "installed: $0"' trsh
          test -f "$RUNNER_TEMP/prefix/share/man/man1/trsh.1"

      - name: Uninstall
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test ! -e "$RUNNER_TEMP/prefix/bin/trsh"
