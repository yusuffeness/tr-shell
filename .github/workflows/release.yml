name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build and test
        run: make && make test

      - name: Check the version matches the tag
        run: |
          version="$(./trsh --surum | awk '{print $2}')"
          tag="${GITHUB_REF_NAME#v}"
          case "$version" in
            "$tag"|"$tag".*) ;;
            *) echo "trsh reports $version but the tag is $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Package
        run: |
          name="trsh-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$name"
          cp trsh README.md LICENSE CHANGELOG.md "dist/$name/"
          cp -r examples "dist/$name/examples"
          cp docs/trsh.1 "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "tr-shell $GITHUB_REF_NAME" --notes-file notes.md
